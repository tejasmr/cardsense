name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Repository Secrets into config.js
        run: |
          SHEET_URL="${{ secrets.GOOGLE_SHEET_URL }}"
          CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          
          if [ -n "$SHEET_URL" ]; then
            sed -i "s|__GOOGLE_SHEET_URL__|$SHEET_URL|g" static/config.js
          fi
          
          if [ -n "$CLIENT_ID" ]; then
            sed -i "s|__GOOGLE_CLIENT_ID__|$CLIENT_ID|g" static/config.js
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
